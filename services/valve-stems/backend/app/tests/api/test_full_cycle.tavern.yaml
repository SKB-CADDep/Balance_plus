test_name: "Интеграция: Полный цикл расчета штоков"

stages:
  # =================================================================
  # ШАГ 1: Запрашиваем турбину
  # =================================================================
  - name: "Получение данных турбины (ID = 1)"
    request:
      url: "http://localhost:5253/api/v1/turbines/1"
      method: GET
    response:
      status_code: 200

  # =================================================================
  # ШАГ 2: Запрашиваем клапаны
  # =================================================================
  - name: "Получение списка клапанов для турбины"
    request:
      url: "http://localhost:5253/api/v1/valves"
      method: GET
      params:
        turbine_id: 1
    response:
      status_code: 200

  # =================================================================
  # ШАГ 3: Отправляем JSON на расчет и сверяем ответ
  # =================================================================
  - name: "Расчет MultiCalculationParams и проверка ответа"
    request:
      url: "http://localhost:5253/api/v1/calculations/multi"
      method: POST
      headers:
        content-type: "application/json"
      json:
        turbine_id: 1
        globals:
          P_fresh: 130
          P_fresh_unit: "кгс/см²"
          T_fresh: 555
          T_fresh_unit: "°C"
          P_air: 1.03
          P_air_unit: "кгс/см²"
          T_air: 40
          T_air_unit: "°C"
          P_lst_leak_off: 0.97
          P_lst_leak_off_unit: "кгс/см²"
        groups:
          - valve_id: 9
            type: "СК"
            valve_names: ["БТ-252380"]
            quantity: 2
            p_values: [130, 6, 1.03]
            p_values_unit: "кгс/см²"
            p_leak_offs: