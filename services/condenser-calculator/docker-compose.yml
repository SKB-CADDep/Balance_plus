services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: condenser_calculator_frontend
    restart: unless-stopped
    ports:
      - "3035:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: condenser_calculator_backend
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=condenser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=condenser_calc
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8010/api/v1/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:17-alpine
    container_name: condenser_calculator_db
    restart: unless-stopped
    ports:
      - "5255:5432"
    environment:
      - POSTGRES_USER=condenser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=condenser_calc
    volumes:
      - condenser_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U condenser -d condenser_calc" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  condenser_db_data:
