version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: condenser_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: balance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: condenser_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: condenser_api
    restart: always
    ports:
      - "8010:8010"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/balance_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: condenser_worker
    restart: always
    # Запуск Celery воркера
    command: poetry run celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/balance_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
