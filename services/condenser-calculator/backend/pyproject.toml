[project]
name = "condenser-calculator"
version = "0.1.0"
description = "Расчетный модуль конденсаторов паровых турбин"
authors = [
    {name = "SKBT Optimization Department"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "alembic (>=1.13.3,<2.0.0)",
    "psycopg[binary] (>=3.1.13,<4.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "pydantic-settings (>=2.6.1,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "scipy (>=1.13.0,<2.0.0)",
    "seuif97 (==1.2.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pandas (>=3.0.3)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=7.4.0,<8.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
httpx = ">=0.27.0,<1.0.0"
pytest-asyncio = "^1.3.0"
ruff = "^0.15.0"
pyyaml = "^6.0.3"


[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"


[tool.poetry.dependencies]
celery = {source = "tuna"}
redis = {source = "tuna"}
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "B", "I", "W", "C", "UP", "RUF", "ANN", "ASYNC", "PLC"
]
ignore = ["E501", "ANN401", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"