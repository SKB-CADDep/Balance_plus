valve-stems-frontend:
  config:
    # Внешний URL бэкенда, куда браузер клиента будет отправлять API-запросы
    VITE_API_URL: "https://api-valve-stems.your-domain.com"

  secrets:
    # Фронтенд-приложение, как правило, не хранит рантайм-секретов,
    # так как весь код виден в браузере. Но если девопс использует 
    # токены для доступа к NPM-регистрам при сборке, их можно указать здесь.
    NPM_AUTH_TOKEN: ""